# Local / self-hosted run:  docker compose up --build  →  http://localhost:8080
services:
  moviejuke:
    build: .
    image: moviejuke:local
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MJ_LOG: "1"
    volumes:
      # keep profiles, favorites, history and the queue across restarts
      - moviejuke-state:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3

volumes:
  moviejuke-state:
