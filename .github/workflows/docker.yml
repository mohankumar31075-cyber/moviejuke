name: Container

# Builds the production image and publishes it to the GitHub Container Registry
# on every push to main (plus version tags). The image is runnable anywhere:
#
#   docker run -p 8080:8080 ghcr.io/<owner>/moviejuke:latest
#
# Pull requests build only, so a broken Dockerfile fails review instead of main.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          set -e
          docker run -d --name moviejuke-test -p 8085:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8085/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8085/api/meta | head -c 120
          curl -fsS -o /dev/null -w "\nindex: %{http_code}\n" http://127.0.0.1:8085/
          docker logs moviejuke-test | tail -3
          docker rm -f moviejuke-test
