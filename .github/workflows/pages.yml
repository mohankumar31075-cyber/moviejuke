name: Deploy to GitHub Pages

# Publishes the prerendered static build to GitHub Pages — a live, public URL
# with no server and no secrets required.
#
#   https://<owner>.github.io/<repo>/
#
# Enable it once in Settings → Pages → Build and deployment → Source:
# "GitHub Actions" (this workflow also asks GitHub to enable Pages itself).

on:
  push:
    # the working branch is included temporarily so the pipeline can be
    # verified live before the pull request lands on main
    branches: [main, arena/01a0f752-moviejuke]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prerender the catalogue
        run: node scripts/build-static.js

      - name: Verify the artifact is self-contained
        run: |
          set -e
          test -f dist/index.html
          test -f dist/api/meta.json
          test -f dist/api/catalog.json
          test -f dist/api/live.json
          test -f dist/api/home.json
          test -f dist/.nojekyll
          test "$(ls dist/api/titles | wc -l)" -gt 50
          grep -q "__MJ_STATIC__" dist/index.html
          echo "static artifact OK ($(du -sh dist | cut -f1))"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
