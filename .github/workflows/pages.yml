name: Deploy to GitHub Pages

# Publishes the prerendered static build to GitHub Pages — a live, public URL
# with no server, no database and no secrets.
#
#   https://<owner>.github.io/<repo>/
#
# ONE-TIME SETUP (by a repository admin):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Until that is done the workflow succeeds with a warning explaining the step,
# rather than failing with a permissions error.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prerender the catalogue
        run: node scripts/build-static.js

      - name: Verify the artifact is self-contained
        run: |
          set -e
          test -f dist/index.html
          test -f dist/api/meta.json
          test -f dist/api/catalog.json
          test -f dist/api/live.json
          test -f dist/api/home.json
          test -f dist/.nojekyll
          test "$(ls dist/api/titles | wc -l)" -gt 50
          grep -q "__MJ_STATIC__" dist/index.html
          echo "static artifact OK ($(du -sh dist | cut -f1))"

      - name: Attach the site bundle
        uses: actions/upload-artifact@v4
        with:
          name: moviejuke-static-site
          path: dist
          retention-days: 14

      - name: Check whether Pages is enabled
        id: probe
        run: |
          set +e
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages API returned HTTP $code"
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain the one-time setup step
        if: steps.probe.outputs.ready != 'true'
        run: |
          {
            echo "### GitHub Pages is not enabled yet"
            echo ""
            echo "The static build was produced and verified, but Pages must be switched on once:"
            echo ""
            echo "1. Repository **Settings → Pages**"
            echo "2. **Build and deployment → Source: GitHub Actions**"
            echo "3. Re-run this workflow (or push to \`main\`)"
            echo ""
            echo "The site will then be served from \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Enable Pages in Settings → Pages → Source: GitHub Actions, then re-run this workflow."

      - uses: actions/configure-pages@v5
        if: steps.probe.outputs.ready == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.probe.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
